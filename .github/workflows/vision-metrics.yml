name: Vision metrics tests

on:
  push:
    branches:
      - feature/security-and-clinical-improvements
  pull_request:
    branches:
      - main

jobs:
  python-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile vision Python modules
        working-directory: server/vision
        run: python -m py_compile analyze_video.py metrics.py tracking.py test_metrics.py test_tracking.py
      - name: Run pure kinematics unit tests
        working-directory: server/vision
        run: python -m unittest -v test_metrics.py test_tracking.py

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript checks
        run: pnpm check
