name: Vision metrics tests

on:
  push:
    branches:
      - feature/security-and-clinical-improvements
  pull_request:
    branches:
      - main

jobs:
  python-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pure kinematics unit tests
        working-directory: server/vision
        run: python -m unittest -v test_metrics.py
