name: Vision metrics tests

on:
  push:
    branches:
      - main
      - feature/security-and-clinical-improvements
      - feature/kalman-hungarian-tracking
      - feature/ground-truth-benchmark
      - feature/casa-complete-validation-v2
  pull_request:
    branches:
      - main

jobs:
  python-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile vision Python modules
        working-directory: server/vision
        run: python -m py_compile analyze_video.py concentration.py metrics.py tracking.py ground_truth_benchmark.py test_concentration.py test_metrics.py test_tracking.py test_ground_truth_benchmark.py datasets/prepare_morphology_dataset.py datasets/train_morphology_model.py datasets/test_prepare_morphology_dataset.py
      - name: Run pure kinematics unit tests
        working-directory: server/vision
        run: python -m unittest -v test_concentration.py test_metrics.py test_tracking.py test_ground_truth_benchmark.py
      - name: Run morphology dataset preparation tests
        working-directory: server/vision/datasets
        run: python -m unittest -v test_prepare_morphology_dataset.py

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript checks
        run: pnpm check
      - name: Run application tests
        run: pnpm test
