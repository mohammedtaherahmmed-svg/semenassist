name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_BASE_URL: https://semenassist-bvur8ptx.manus.space

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript
        run: pnpm check

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" "semenassist-v1.0.5-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: semenassist-v1.0.5-release-apk
          path: semenassist-v1.0.5-release.apk
          if-no-files-found: error
          retention-days: 30
